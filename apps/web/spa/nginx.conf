server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ? SPA: every route that is not a file is answered by index.html and resolved by the router in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ? Hashed assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
