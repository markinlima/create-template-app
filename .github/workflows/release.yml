name: "Release"

# ? One workflow for every app: the app comes from the tag prefix (<app>-vX.Y.Z[-rcN]) and its
# ? deploy settings from projects.json. Adding an app is a new entry there, not a new workflow.
on:
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish (e.g. web-v1.0.5 or web-v1.0.5-rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ? Validates the tag, its source branch and the app's release config before anything is tested or built.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.release.outputs.app }}
      path: ${{ steps.release.outputs.path }}
      version: ${{ steps.release.outputs.version }}
      is-rc: ${{ steps.release.outputs.is-rc }}
      ref: ${{ steps.release.outputs.ref }}
      environment: ${{ steps.release.outputs.environment }}
      phase-app-id: ${{ steps.release.outputs.phase-app-id }}
      dokploy-compose-id: ${{ steps.release.outputs.dokploy-compose-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install: false

      - name: Resolve the release
        id: release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: bun .github/scripts/resolve-release.ts

  app-tests:
    needs: prepare
    uses: ./.github/workflows/reuse-app-tests.yml
    with:
      apps: ${{ needs.prepare.outputs.app }}
      ref: ${{ needs.prepare.outputs.ref }}
      suites: unit,integration,e2e

  build-image:
    needs: [prepare, app-tests]
    uses: ./.github/workflows/reuse-build-image.yml
    concurrency:
      group: release-build-${{ needs.prepare.outputs.app }}-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    with:
      app: ${{ needs.prepare.outputs.app }}
      path: ${{ needs.prepare.outputs.path }}
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      is-rc: ${{ needs.prepare.outputs.is-rc == 'true' }}
      environment: ${{ needs.prepare.outputs.environment }}
      phase-app-id: ${{ needs.prepare.outputs.phase-app-id }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      PHASE_HOST: ${{ secrets.PHASE_HOST }}
      PHASE_SERVICE_TOKEN: ${{ secrets.PHASE_SERVICE_TOKEN }}

  deploy:
    needs: [prepare, build-image]
    uses: ./.github/workflows/reuse-deploy.yml
    concurrency:
      group: release-deploy-${{ needs.prepare.outputs.app }}-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    with:
      compose-id: ${{ needs.prepare.outputs.dokploy-compose-id }}
      environment: ${{ needs.prepare.outputs.environment }}
      ref: ${{ needs.prepare.outputs.ref }}
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
