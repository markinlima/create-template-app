name: "CI - Push Validation"

# ? Every push to a work branch gets the fast checks and the apps' unit tests; integration and e2e run on the pull request.
# ? The trunks are left out: what reaches them came through a pull request, and that run already tested the merge result.
on:
  push:
    # ? Branches only: release tags are validated by release.yml.
    branches-ignore:
      - dev
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/reuse-quality.yml
    secrets:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  app-tests:
    uses: ./.github/workflows/reuse-app-tests.yml
    with:
      suites: unit

  # ? Single check to require in the branch rules: it fails when any job above failed or was cancelled.
  ci-ok:
    if: always()
    needs: [quality, app-tests]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
