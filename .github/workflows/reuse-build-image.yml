name: "Reusable - Build Image"

on:
  workflow_call:
    inputs:
      app:
        description: "App to build (its workspace name, also the image tag prefix)"
        required: true
        type: string
      path:
        description: "App folder, holding its dockerfile (e.g. apps/web)"
        required: true
        type: string
      ref:
        description: "Git ref to build (e.g. refs/tags/web-v1.0.5), so the image holds exactly the released code"
        required: true
        type: string
      version:
        description: "Version used in the image tag (e.g. 1.0.5 or 1.0.5-rc1)"
        required: true
        type: string
      is-rc:
        description: "Whether this version is a release candidate (tags rc-latest instead of latest)"
        required: true
        type: boolean
      environment:
        description: "Phase environment to read the build-time envs from (production or staging)"
        required: true
        type: string
      phase-app-id:
        description: "Phase app id to read the build-time envs from. Empty when the app needs none."
        required: false
        type: string
        default: ""
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      PHASE_HOST:
        required: false
      PHASE_SERVICE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - if: inputs.phase-app-id != ''
        uses: ./.github/actions/setup
        with:
          install: false

      - name: Export build-time envs from Phase
        id: phase
        if: inputs.phase-app-id != ''
        env:
          PHASE_APP_ID: ${{ inputs.phase-app-id }}
          PHASE_ENV: ${{ inputs.environment }}
          PHASE_HOST: ${{ secrets.PHASE_HOST }}
          PHASE_SERVICE_TOKEN: ${{ secrets.PHASE_SERVICE_TOKEN }}
        run: bun .github/scripts/phase-env.ts

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ? Every app shares the <user>/apps repository: the tag holds the app, plus a floating latest/rc-latest.
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.path }}/dockerfile
          target: production
          pull: true
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/apps:${{ inputs.app }}-${{ inputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/apps:${{ inputs.app }}-${{ inputs.is-rc && 'rc-latest' || 'latest' }}
          secret-files: ${{ steps.phase.outputs.path && format('build-env={0}', steps.phase.outputs.path) || '' }}
          cache-from: type=gha,scope=${{ inputs.app }}-production
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}-production

      - name: Remove the build env file
        if: always() && steps.phase.outputs.path != ''
        env:
          ENV_FILE: ${{ steps.phase.outputs.path }}
        run: rm -f "$ENV_FILE"
