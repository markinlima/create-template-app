version: 2

updates:
  # ? Keeps the SHA-pinned actions (and their "# vX.Y.Z" comments) up to date in the workflows and composite actions.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    # ? branch-workflow.md: every change reaches the trunks through dev.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
